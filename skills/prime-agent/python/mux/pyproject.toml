# Pacote do kernel do Prime Agent: os panes do tmux e do herdr como funções Python.
# Só embrulha o scripts/mux.sh da skill prime-agent, que é a fonte da lógica.
[project]
name = "mux"
version = "0.1.0"
description = "Prime Agent skill: drive tmux and herdr panes (TNN/HNN ids) through mux.sh"
requires-python = ">=3.10"
dependencies = ["nats-py>=2.16,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mux"]
